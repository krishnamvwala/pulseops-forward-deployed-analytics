<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">PulseOps system architecture</title>
  <desc id="description">A governed flow from customer CSV ingestion through validation, transformation, quarantine, trusted analytics, and optional AI investigation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="trusted" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#172554" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .label { font-family: Inter, Arial, sans-serif; fill: #111827; }
      .muted { font-family: Inter, Arial, sans-serif; fill: #64748b; }
      .title { font-size: 38px; font-weight: 800; }
      .subtitle { font-size: 18px; }
      .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 2px; fill: #4f46e5; }
      .node-title { font-size: 19px; font-weight: 800; }
      .node-copy { font-size: 14px; }
      .lane { font-size: 13px; font-weight: 800; letter-spacing: 1.5px; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#background)"/>
  <rect x="50" y="44" width="1500" height="812" rx="28" fill="#ffffff" stroke="#dbe2f0"/>
  <text x="95" y="105" class="eyebrow">PULSEOPS · FORWARD-DEPLOYED ANALYTICS</text>
  <text x="95" y="154" class="label title">From raw customer data to governed decisions</text>
  <text x="95" y="188" class="muted subtitle">Safe corrections are automated. Ambiguous values stay visible until a human verifies them.</text>

  <rect x="95" y="230" width="210" height="72" rx="20" fill="url(#brand)"/>
  <text x="125" y="260" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.4" fill="#c7d2fe">CUSTOMER INPUT</text>
  <text x="125" y="285" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Daily sales CSV</text>

  <path class="arrow" d="M305 266 H360"/>

  <g filter="url(#shadow)">
    <rect x="365" y="225" width="205" height="82" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="400" cy="266" r="21" fill="#eef2ff"/>
    <text x="393" y="273" class="label node-title" fill="#4f46e5">1</text>
    <text x="435" y="258" class="label node-title">Extract</text>
    <text x="435" y="281" class="muted node-copy">Preserve raw values</text>

    <rect x="615" y="225" width="205" height="82" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="650" cy="266" r="21" fill="#eef2ff"/>
    <text x="643" y="273" class="label node-title" fill="#4f46e5">2</text>
    <text x="685" y="258" class="label node-title">Validate</text>
    <text x="685" y="281" class="muted node-copy">Enforce the contract</text>

    <rect x="865" y="225" width="205" height="82" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="900" cy="266" r="21" fill="#eef2ff"/>
    <text x="893" y="273" class="label node-title" fill="#4f46e5">3</text>
    <text x="935" y="258" class="label node-title">Transform</text>
    <text x="935" y="281" class="muted node-copy">Normalize safe values</text>
  </g>

  <path class="arrow" d="M570 266 H610"/>
  <path class="arrow" d="M820 266 H860"/>

  <rect x="1115" y="225" width="330" height="82" rx="18" fill="url(#trusted)"/>
  <text x="1150" y="258" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Trusted analytical dataset</text>
  <text x="1150" y="282" font-family="Inter, Arial, sans-serif" font-size="14" fill="#d1fae5">Published rows pass every active rule</text>
  <path class="arrow" d="M1070 266 H1110"/>

  <text x="95" y="390" class="muted lane">EXCEPTION CONTROL LOOP</text>
  <rect x="365" y="420" width="455" height="150" rx="22" fill="#fffaf5" stroke="#f1c792" filter="url(#shadow)"/>
  <text x="400" y="458" class="label node-title">Quarantine + issue evidence</text>
  <text x="400" y="487" class="muted node-copy">Missing values, invalid dates, conflicting IDs, and outliers</text>
  <rect x="400" y="515" width="176" height="32" rx="16" fill="#fef3c7"/>
  <text x="421" y="536" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#92400e">Excluded from KPIs</text>
  <path class="arrow" d="M715 307 V376 H592 V415"/>

  <rect x="865" y="420" width="455" height="150" rx="22" fill="#f8fafc" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="900" y="458" class="label node-title">Human-verified remediation</text>
  <text x="900" y="487" class="muted node-copy">Correct one row or upload a governed batch correction</text>
  <rect x="900" y="515" width="253" height="32" rx="16" fill="#e0e7ff"/>
  <text x="920" y="536" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#3730a3">Revalidate before republishing</text>
  <path class="arrow" d="M820 495 H860"/>
  <path class="arrow dash" d="M1090 420 V372 H718 V312"/>

  <text x="95" y="654" class="muted lane">DECISION + INVESTIGATION LAYER</text>
  <g filter="url(#shadow)">
    <rect x="365" y="686" width="300" height="110" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="400" y="727" class="label node-title">Executive KPIs</text>
    <text x="400" y="755" class="muted node-copy">Revenue · margin · delivery · quality</text>
    <rect x="400" y="771" width="128" height="6" rx="3" fill="#10b981"/>

    <rect x="700" y="686" width="300" height="110" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="735" y="727" class="label node-title">Governed local SQL</text>
    <text x="735" y="755" class="muted node-copy">Allowlisted queries + visible evidence</text>
    <rect x="735" y="771" width="128" height="6" rx="3" fill="#4f46e5"/>

    <rect x="1035" y="686" width="410" height="110" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1070" y="727" class="label node-title">PulseOps AI Agent</text>
    <text x="1070" y="755" class="muted node-copy">FastAPI · Foundry · read-only tools · audit events</text>
    <rect x="1070" y="771" width="128" height="6" rx="3" fill="#7c3aed"/>
  </g>

  <path class="arrow" d="M1280 307 V632 H515 V681"/>
  <path class="arrow" d="M665 741 H695"/>
  <path class="arrow dash" d="M1000 741 H1030"/>

  <rect x="95" y="702" width="215" height="70" rx="18" fill="#172554"/>
  <text x="125" y="732" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2" fill="#a5b4fc">TRUST PRINCIPLE</text>
  <text x="125" y="757" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">No values are guessed</text>

  <text x="95" y="830" class="muted node-copy">Portfolio architecture · Synthetic data · Built by Krishna Mvwala</text>
</svg>
